services:
  db:
    image: mariadb:10.11
    container_name: urna_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-urna}
      MYSQL_USER: ${DB_USER:-urna}
      MYSQL_PASSWORD: ${DB_PASS:-urna123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - urna_db_data:/var/lib/mysql
    networks:
      - urna_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ../..
      dockerfile: devops/docker/Dockerfile
    container_name: urna_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-urna}
      DB_USER: ${DB_USER:-urna}
      DB_PASS: ${DB_PASS:-urna123}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - urna_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: urna_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    depends_on:
      - db
    networks:
      - urna_network

volumes:
  urna_db_data:
    driver: local

networks:
  urna_network:
    driver: bridge
