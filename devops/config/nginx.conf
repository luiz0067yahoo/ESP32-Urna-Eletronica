# ==============================================================================
# NGINX VHOST CONFIG - PIKU / SERVIDOR NATIVO (SEM DOCKER)
# Coloque em /etc/nginx/sites-available/urna_eletronica ou use com Piku
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Diretório raiz do projeto
    root /home/piku/.piku/apps/urna-eletronica;
    index index.html index.php;

    charset utf-8;

    # Redireciona a raiz para a tela inicial da urna
    location = / {
        return 301 /frontend/index.html;
    }

    # Frontend estático
    location /frontend/ {
        try_files $uri $uri/ /frontend/index.html;
    }

    # Backend PHP API RESTful (via PHP-FPM ou porta local Piku)
    location /backend/ {
        try_files $uri $uri/ /backend/index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # Socket PHP-FPM nativo do sistema:
            fastcgi_pass unix:/run/php/php-fpm.sock;
            # Ou via porta interna do PHP built-in server:
            # fastcgi_pass 127.0.0.1:9000;
        }
    }

    # Bloqueia acesso a arquivos sensíveis
    location ~ /\.(env|git|ht) {
        deny all;
    }
}
