<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica</title>
    <style>
        html,body{
            width: 100%;
            height: 100%;
            padding: 0 0 0 0;
            margin: 0 0 0 0;
            display: flex;
        }
        /* Colunas */
        .col1 { grid-column: 1; }
        .col2 { grid-column: 2; }
        .col12 { grid-column: 1 / span 2; }

        /* Linhas */
        .row1  { grid-row: 1; }
        .row2  { grid-row: 2; }
        .row3  { grid-row: 3; }
        .row4  { grid-row: 4; }
        .row5  { grid-row: 5; }
        .row6  { grid-row: 6; }
        .row7  { grid-row: 7; }
        .row8  { grid-row: 8; }
        .row9  { grid-row: 9; }
        .row10 { grid-row: 10; }
        .row11 { grid-row: 11; }

        /* Span */
        .row1x4 { grid-row: 1 / span 4; }
        .row5x2 { grid-row: 5 / span 2; }
        .row5x4 { grid-row: 5 / span 4; }
        div.urna {
           width: 100%;
           height: 100%;
           display: flex;
           background-color: #FFC;
           padding: 40px 40px 40px 40px;
           box-sizing: border-box;
        }
        div.tela {
           width: 66%;
           height: 100%;
           margin-right: 40px;
           border: 10px solid black;
           font-size: 30px;
           background-color: white;
           display: grid;
           grid-template-columns: repeat(2, 1fr);
           box-sizing: border-box;
        }

        /* Campo do número */
        input.numero{
            width: 80px;              /* ajuste conforme o cargo */
            height: 45px;

            border: 2px solid #000;
            outline: none;

            background:
                repeating-linear-gradient(
                    to right,
                    transparent 0,
                    transparent 38px,
                    #000 38px,
                    #000 40px
                );

            letter-spacing: 18px;
            text-align: left;
            text-indent: 10px;
            font-size: 34px;
            font-weight: bold;
            font-family: monospace;

            padding: 0;
            box-sizing: border-box;
        }

        /* Remove setas em alguns navegadores */
        input.numero[type=number]::-webkit-inner-spin-button,
        input.numero[type=number]::-webkit-outer-spin-button{
            -webkit-appearance:none;
            margin:0;
        }

        input.numero[type=number]{
            -moz-appearance:textfield;
        }

        /* Foto do candidato */
        div.foto-candidato{
            border:2px solid #000;
            background:#EEE;

            display:grid;
            place-items:center;

            width:100%;
            height:100%;
            justify-self:center;
            align-self:start;
        }

        /* Foto do vice */
        div.foto-vice{
            border:2px solid #000;
            background:#EEE;

            display:grid;
            place-items:center;

            margin-top: 20px;
            width:80%;
            height:80%;

            justify-self:end;
            align-self:start;
        }
        div.teclado {
            margin-top: 60px;
            padding: 20px;
            background-color: #555;
            box-sizing: border-box;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(5, auto);
            gap: 20px;

            justify-items: stretch;
            align-items: stretch;
        }

        div.teclado > button {
            box-sizing: border-box;
            font-size: 30px;
        }

        div.teclado > button.digito {            
            background-color: #000;
            color: #fff;
        }

        div.teclado > button.branco {            
            background-color: #fff;
            color: #000;
        }
        div.teclado >button.corrige {            
            background-color: #f00;
            color: #FFF;
        }
        div.teclado > button.confirma {            
            background-color: #0f0;
            color: #000;
        }
    </style>    
</head>
<body>
    <div class="urna">
        <div class="tela">
            <div class="col1 row1">TREINAMENTO</div>

            <div class="col1 row2">PREFEITA</div>

            <div class="col1 row3">
                Número:
                <input class="numero"
                    type="text"
                    maxlength="2"
                    autocomplete="off">
            </div>

            <div class="col1 row4">
                Nome: Bombeira
            </div>

            <div class="col1 row5">
                Partido: PProt
            </div>

            <div class="col1 row6">
                Vice-prefeito: Motorista
            </div>

            <div class="col2 row1x4 foto-candidato">
                Foto
            </div>

            <div class="col2 row5x4 foto-vice">
                Vice
            </div>

            <div class="col12 row8">
                Aperte a tecla:
            </div>

            <div class="col12 row9">
                VERDE para CONFIRMAR este voto
            </div>

            <div class="col12 row10">
                VERMELHO para CORRIGIR este voto
            </div>

            <div class="col12 row11">
                BRANCO para votar em BRANCO
            </div>

        </div>
        <div class="teclado">
            <button class="digito">1</button>
            <button class="digito">2</button>
            <button class="digito">3</button>
            <button class="digito">4</button>
            <button class="digito">5</button>
            <button class="digito">6</button>
            <button class="digito">7</button>
            <button class="digito">8</button>
            <button class="digito">9</button>
            <div></div>
            <button class="digito">0</button>
            <div></div>
            <button class="branco">BRANCO</button>
            <button class="corrige">CORRIGE</button> 
            <button class="confirma">CONFIRMA</button>
        </div>
    </div>
</body>
</html>
