name: Deploy Automático - Podman

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'db/**'
      - 'devops/podman/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Formatar nome da imagem (minúsculas)
        id: repo
        run: |
          echo "image=${GITHUB_REPOSITORY,,}-podman" >> $GITHUB_OUTPUT

      - name: Instalar Podman / Buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Autenticar no GitHub Packages
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

      - name: Build da imagem OCI com Podman
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          podman build \
            -t ${{ env.REGISTRY }}/${{ steps.repo.outputs.image }}:latest \
            -t ${{ env.REGISTRY }}/${{ steps.repo.outputs.image }}:${SHORT_SHA} \
            -f devops/podman/Containerfile .

      - name: Push da imagem OCI para o Registry
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          podman push ${{ env.REGISTRY }}/${{ steps.repo.outputs.image }}:latest
          podman push ${{ env.REGISTRY }}/${{ steps.repo.outputs.image }}:${SHORT_SHA}

      - name: Deploy no Servidor Podman via SSH (Opcional)
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            cd /var/www/urna-eletronica/devops/podman
            ./deploy-git.sh main
          EOF
